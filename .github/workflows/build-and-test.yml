name: Build and test

on:
  workflow_call:
  push:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:run

      - name: Build project
        run: npm run build

  types-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The `supabase` CLI is a pinned devDependency, so `npm ci` installs the
      # exact version that generated the committed types. No separate CLI pin to
      # keep in sync — dependabot bumps it like any other dependency, and both
      # `supabase start` and `gen:types` below use that one version.
      - name: Install dependencies
        run: npm ci

      # Fresh DB with only the committed migrations applied — no stray tables.
      - name: Start Supabase
        run: npx supabase start

      - name: Regenerate database types
        run: npm run gen:types

      - name: Fail if database.ts is out of date
        run: git diff --exit-code src/lib/types/database.ts
